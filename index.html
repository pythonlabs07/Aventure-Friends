<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1f2533" />
  <title>Aventure Friends</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #111722;
      font-family: "Courier New", monospace;
      overflow: hidden;
      touch-action: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-wrap {
      position: relative;
      width: min(100vw, calc(100svh * 1.6666667));
      aspect-ratio: 5 / 3;
      max-width: 100vw;
      max-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111722;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      background: #4ab9f5;
      touch-action: none;
    }

    #touch-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      display: none;
    }

    .touch-btn {
      position: absolute;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      border: 2px solid rgba(255,255,255,.48);
      background: rgba(12, 24, 38, .60);
      color: #fff;
      font: 900 clamp(16px, 2vw, 24px) "Courier New", monospace;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 24%;
      backdrop-filter: blur(2px);
    }

    .touch-btn:active {
      transform: scale(.94);
      background: rgba(30, 70, 105, .78);
    }

    #move-left {
      left: 2.5%;
      bottom: 3.5%;
      width: 7.5%;
      aspect-ratio: 1 / 1;
    }

    #move-right {
      left: 11.5%;
      bottom: 3.5%;
      width: 7.5%;
      aspect-ratio: 1 / 1;
    }

    #jump-btn {
      right: 2.8%;
      bottom: 3.2%;
      width: 9%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      font-size: clamp(12px, 1.6vw, 20px);
    }

    #rotate-tip {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      background: #111722;
      color: white;
      font-size: 20px;
      line-height: 1.4;
      z-index: 10;
    }

    @media (orientation: portrait) and (max-width: 700px) {
      #rotate-tip {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="1000" height="600" aria-label="Aventure Friends"></canvas>

    <div id="touch-controls" aria-label="Controles do jogo">
      <button id="move-left" class="touch-btn" type="button" aria-label="Mover para esquerda">◀</button>
      <button id="move-right" class="touch-btn" type="button" aria-label="Mover para direita">▶</button>
      <button id="jump-btn" class="touch-btn" type="button" aria-label="Pular">PULAR</button>
    </div>
  </div>

  <div id="rotate-tip">
    Vire o celular para a horizontal para jogar melhor.
  </div>

        return (
          a.x < b.x + b.w &&
          a.x + a.w > b.x &&
          a.y < b.y + b.h &&
          a.y + a.h > b.y
        );
      }

      function pointInRect(x, y, r) {
        return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

        player.y = GROUND_Y - PLAYER_H;

        }

        resetGame();
        state = "game";
      }

      function selectCharacter(index) {
        releaseTouchButtons();
        if (index < 0 || index >= characters.length) return;
        selectedCharacter = index;

        if (characters[selectedCharacter].loaded) {
          state = "menu";
        }
      }

      function updateGame() {
        if (gameOver || won) {
          pressed.jumpQueued = false;
          return;
        }

        player.vx = 0;

        if (pressed.left && !pressed.right) {
          player.vx = -SPEED;
        } else if (pressed.right && !pressed.left) {
          player.vx = SPEED;
        }

        if (pressed.jumpQueued && player.grounded) {
          player.vy = JUMP;
          player.grounded = false;
        }

        pressed.jumpQueued = false;

        // Movimento horizontal
        player.x += player.vx;

        for (const p of platforms) {
          if (intersects(player, p)) {
            if (player.vx > 0) {
              player.x = p.x - player.w;
            } else if (player.vx < 0) {
              player.x = p.x + p.w;
            }
          }
        }

        player.x = Math.max(0, Math.min(WORLD_WIDTH - player.w, player.x));

        // Movimento vertical
        player.vy += GRAVITY;
        if (player.vy > MAX_FALL) player.vy = MAX_FALL;

        player.y += player.vy;
        player.grounded = false;

        for (const p of platforms) {
          if (intersects(player, p)) {
            if (player.vy > 0) {
              player.y = p.y - player.h;
              player.vy = 0;
              player.grounded = true;
            } else if (player.vy < 0) {
              player.y = p.y + p.h;
              player.vy = 0;
            }
          }
        }

        // Sensor dos pés
        const foot = {
          x: player.x + 8,
          y: player.y + player.h,
          w: player.w - 16,
          h: 4
        };

        for (const p of platforms) {
          if (intersects(foot, p)) {
            player.grounded = true;
            break;
          }
        }

        if (player.y > H + 140) {
          loseLife();
        }

        // Moedas
        for (const coin of coins) {
          if (!coin.collected && intersects(player, coin)) {
            coin.collected = true;
            coinCount += 1;
            points += 100;
          }
        }

        // Inimigos
        for (const enemy of enemies) {
          if (!enemy.alive) continue;

          enemy.x += enemy.vx;

          if (enemy.x <= enemy.min) {
            enemy.x = enemy.min;
            enemy.vx = Math.abs(enemy.vx);
          }

          if (enemy.x >= enemy.max) {
            enemy.x = enemy.max;
            enemy.vx = -Math.abs(enemy.vx);
          }

          if (intersects(player, enemy)) {
            const playerBottom = player.y + player.h;

            if (player.vy > 0 && playerBottom <= enemy.y + 30) {
              enemy.alive = false;
              player.y = enemy.y - player.h;
              player.vy = -9;
              points += 200;
            } else {
              loseLife();
              break;
            }
          }
        }

        if (intersects(player, flag)) {
          won = true;
          points += 1000;
        }

        cameraX = player.x + player.w / 2 - W / 2;
        cameraX = Math.max(0, Math.min(WORLD_WIDTH - W, cameraX));
      }

      function drawText(text, x, y, size, color, align = "left", weight = "700") {
        ctx.font = `${weight} ${size}px "Courier New", monospace`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        ctx.fillText(text, x, y);
      }

      function drawRetroText(text, x, y, size, align = "center") {
        ctx.font = `900 ${size}px "Courier New", monospace`;
        ctx.textAlign = align;
        ctx.textBaseline = "middle";

        ctx.fillStyle = "#5b3d2a";
        ctx.fillText(text, x + 4, y + 5);

        ctx.fillStyle = "#f7eecb";
        ctx.fillText(text, x, y);
      }

      function drawMenuBackground() {
        ctx.fillStyle = "#0d1722";
        ctx.fillRect(0, 0, W, H);

        if (menuBackgroundImage.complete && menuBackgroundImage.naturalWidth) {
          // Preenche toda a largura e ancora no topo para preservar o título da arte.
          const scale = W / menuBackgroundImage.naturalWidth;
          const drawW = W;
          const drawH = menuBackgroundImage.naturalHeight * scale;

          ctx.drawImage(
            menuBackgroundImage,
            0,
            0,
            drawW,
            drawH
          );
        }

        // Deixa a região das opções mais legível.
        const grad = ctx.createLinearGradient(0, H * 0.42, 0, H);
        grad.addColorStop(0, "rgba(5,10,18,0.04)");
        grad.addColorStop(0.55, "rgba(5,10,18,0.36)");
        grad.addColorStop(1, "rgba(5,10,18,0.70)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
      }

      function drawCactus(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);

        ctx.fillStyle = "#4e702d";
        ctx.fillRect(-10, 0, 22, 90);
        ctx.fillRect(-42, 30, 35, 18);
        ctx.fillRect(-42, 4, 16, 44);
        ctx.fillRect(9, 24, 38, 18);
        ctx.fillRect(31, -2, 16, 44);

        ctx.fillStyle = "#65873b";
        ctx.fillRect(-4, 0, 5, 90);
        ctx.fillRect(-37, 6, 4, 42);
        ctx.fillRect(36, 0, 4, 42);

        ctx.restore();
      }

      function drawMenu() {
        drawMenuBackground();

        const panelX = W / 2 - 300;
        const panelY = 330;
        const panelW = 600;
        const panelH = 155;

        ctx.fillStyle = "rgba(12,20,31,.72)";
        roundRect(ctx, panelX, panelY, panelW, panelH, 20);
        ctx.fill();

        ctx.strokeStyle = "rgba(255,214,72,.82)";
        ctx.lineWidth = 3;
        roundRect(ctx, panelX, panelY, panelW, panelH, 20);
        ctx.stroke();

        const items = [
          { label: "ESCOLHER PERSONAGEM", y: 375 },
          { label: "COMEÇAR", y: 440 }
        ];

        items.forEach((item, index) => {
          const selected = index === menuIndex;

          drawText(
            item.label,
            W / 2,
            item.y,
            31,
            selected ? "#ffe14d" : "#ffffff",
            "center",
            "900"
          );

          if (selected) {
            ctx.fillStyle = "#ffe14d";
            ctx.beginPath();
            ctx.moveTo(W / 2 - 255, item.y);
            ctx.lineTo(W / 2 - 230, item.y - 15);
            ctx.lineTo(W / 2 - 230, item.y + 15);
            ctx.closePath();
            ctx.fill();
          }
        });

        const selected = characters[selectedCharacter];

        ctx.fillStyle = "rgba(12,20,31,.76)";
        roundRect(ctx, 26, 505, 345, 66, 12);
        ctx.fill();

        drawText(
          selected.loaded ? `PERSONAGEM: ${selected.name}` : `FOTO AUSENTE: ${selected.name}`,
          45,
          538,
          17,
          selected.loaded ? "#ffffff" : "#ff8378",
          "left"
        );

        drawText(
          "TOQUE/CLIQUE OU USE ↑ ↓ + ENTER",
          W - 28,
          550,
          15,
          "#ffffff",
          "right"
        );
      }

      function drawSelection() {
        drawMenuBackground();

        ctx.fillStyle = "rgba(20,20,20,.35)";
        ctx.fillRect(0, 0, W, H);

        drawRetroText("ESCOLHA O PERSONAGEM", W / 2, 70, 40);

        const cardW = 165;
        const cardH = 300;
        const gap = 18;
        const total = cardW * 5 + gap * 4;
        const startX = (W - total) / 2;
        const y = 135;

        for (let i = 0; i < characters.length; i++) {
          const c = characters[i];
          const x = startX + i * (cardW + gap);
          const selected = i === selectedCharacter;

          ctx.fillStyle = "#40342c";
          roundRect(ctx, x, y, cardW, cardH, 12);
          ctx.fill();

          ctx.strokeStyle = selected ? COLORS.yellow : "#d7c696";
          ctx.lineWidth = selected ? 5 : 2;
          roundRect(ctx, x, y, cardW, cardH, 12);
          ctx.stroke();

          if (c.loaded) {
            drawImageContain(c.img, x + 15, y + 15, cardW - 30, 200);
          } else {
            ctx.fillStyle = "#303440";
            ctx.fillRect(x + 15, y + 15, cardW - 30, 200);
            drawText("SEM FOTO", x + cardW / 2, y + 115, 17, "#fff", "center");
          }

          drawText(c.name, x + cardW / 2, y + 240, 15, "#fff", "center");

          drawText(
            c.loaded ? "TOQUE PARA ESCOLHER" : "ARQUIVO AUSENTE",
            x + cardW / 2,
            y + 272,
            12,
            c.loaded ? "#e6eaa8" : "#ff7468",
            "center"
          );
        }

        drawText(
          "Ao escolher, você volta ao menu • ESC = voltar",
          W / 2,
          555,
          16,
          "#fff",
          "center"
        );
      }

      function drawImageContain(img, x, y, w, h) {
        if (!img || !img.naturalWidth || !img.naturalHeight) return;

        const scale = Math.min(w / img.naturalWidth, h / img.naturalHeight);
        const dw = img.naturalWidth * scale;
        const dh = img.naturalHeight * scale;
        const dx = x + (w - dw) / 2;
        const dy = y + h - dh;

        ctx.drawImage(img, dx, dy, dw, dh);
      }

      function drawGame() {
        ctx.fillStyle = COLORS.sky;
        ctx.fillRect(0, 0, W, H);

        // Nuvens
        for (let x = 250; x < WORLD_WIDTH; x += 600) {
          const nx = x - cameraX * 0.35;

          ctx.fillStyle = COLORS.white;
          ctx.beginPath();
          ctx.arc(nx, 120, 25, 0, Math.PI * 2);
          ctx.arc(nx + 30, 105, 32, 0, Math.PI * 2);
          ctx.arc(nx + 62, 120, 25, 0, Math.PI * 2);
          ctx.fill();
        }

        // Plataformas
        for (const p of platforms) {
          const sx = p.x - cameraX;

          ctx.fillStyle = COLORS.brown;
          ctx.fillRect(sx, p.y, p.w, p.h);

          ctx.fillStyle = COLORS.green;
          ctx.fillRect(sx, p.y, p.w, 13);

          ctx.fillStyle = COLORS.darkGreen;
          ctx.fillRect(sx, p.y + 10, p.w, 4);
        }

        // Moedas
        for (const coin of coins) {
          if (coin.collected) continue;

          const x = coin.x + coin.w / 2 - cameraX;
          const y = coin.y + coin.h / 2;

          ctx.fillStyle = COLORS.yellow;
          ctx.beginPath();
          ctx.arc(x, y, 12, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = COLORS.orange;
          ctx.lineWidth = 3;
          ctx.stroke();
        }

        // Inimigos
        for (const enemy of enemies) {
          if (!enemy.alive) continue;

          const x = enemy.x - cameraX;

          ctx.fillStyle = COLORS.brown;
          roundRect(ctx, x, enemy.y, enemy.w, enemy.h, 10);
          ctx.fill();

          ctx.fillStyle = COLORS.white;
          ctx.beginPath();
          ctx.arc(x + 12, enemy.y + 14, 6, 0, Math.PI * 2);
          ctx.arc(x + enemy.w - 12, enemy.y + 14, 6, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = COLORS.black;
          ctx.beginPath();
          ctx.arc(x + 13, enemy.y + 14, 3, 0, Math.PI * 2);
          ctx.arc(x + enemy.w - 11, enemy.y + 14, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        // Bandeira
        const fx = flag.x - cameraX;

        ctx.fillStyle = COLORS.white;
        ctx.fillRect(fx, flag.y, 10, flag.h);

        ctx.fillStyle = COLORS.red;
        ctx.beginPath();
        ctx.moveTo(fx + 10, flag.y);
        ctx.lineTo(fx + 105, flag.y + 30);
        ctx.lineTo(fx + 10, flag.y + 60);
        ctx.closePath();
        ctx.fill();

        // Jogador
        const selected = characters[selectedCharacter];
        if (selected.loaded) {
          drawImageContain(
            selected.img,
            player.x - cameraX,
            player.y,
            player.w,
            player.h
          );
        } else {
          ctx.fillStyle = COLORS.blue;
          ctx.fillRect(
            player.x - cameraX,
            player.y,
            player.w,
            player.h
          );
        }

        // HUD
        ctx.fillStyle = COLORS.black;
        ctx.fillRect(0, 0, W, 55);

        drawText(`SCORE ${String(points).padStart(6, "0")}`, 20, 28, 24, COLORS.white);
        drawText(`COINS ${String(coinCount).padStart(2, "0")}`, W / 2, 28, 24, COLORS.yellow, "center");
        drawText(`LIVES ${lives}`, W - 20, 18, 24, COLORS.white, "right");
        drawText(characters[selectedCharacter].name, W - 20, 42, 15, COLORS.white, "right");

        if (gameOver || won) {
          ctx.fillStyle = "rgba(0,0,0,.72)";
          ctx.fillRect(0, 0, W, H);

          drawText(
            gameOver ? "GAME OVER" : "FASE COMPLETA!",
            W / 2,
            H / 2 - 35,
            48,
            gameOver ? COLORS.red : COLORS.yellow,
            "center",
            "900"
          );

          drawButton(W / 2 - 215, H / 2 + 55, 200, 58, "JOGAR DE NOVO");
          drawButton(W / 2 + 15, H / 2 + 55, 200, 58, "PERSONAGENS");
        }
      }

      function drawTouchControls() {
        const alpha = 0.35;

        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        roundRect(ctx, controls.left.x, controls.left.y, controls.left.w, controls.left.h, 20);
        ctx.fill();

        roundRect(ctx, controls.right.x, controls.right.y, controls.right.w, controls.right.h, 20);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(
          controls.jump.x + controls.jump.w / 2,
          controls.jump.y + controls.jump.h / 2,
          42,
          0,
          Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = COLORS.white;

        ctx.beginPath();
        ctx.moveTo(controls.left.x + 20, controls.left.y + 35);
        ctx.lineTo(controls.left.x + 52, controls.left.y + 17);
        ctx.lineTo(controls.left.x + 52, controls.left.y + 53);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(controls.right.x + 55, controls.right.y + 35);
        ctx.lineTo(controls.right.x + 23, controls.right.y + 17);
        ctx.lineTo(controls.right.x + 23, controls.right.y + 53);
        ctx.closePath();
        ctx.fill();

        drawText(
          "PULAR",
          controls.jump.x + controls.jump.w / 2,
          controls.jump.y + controls.jump.h / 2,
          18,
          COLORS.white,
          "center"
        );
      }

      function drawButton(x, y, w, h, text) {
        ctx.fillStyle = COLORS.blue;
        roundRect(ctx, x, y, w, h, 12);
        ctx.fill();

        ctx.strokeStyle = COLORS.white;
        ctx.lineWidth = 2;
        roundRect(ctx, x, y, w, h, 12);
        ctx.stroke();

        drawText(text, x + w / 2, y + h / 2, 17, COLORS.white, "center");
      }

      function roundRect(context, x, y, w, h, radius) {
        const r = Math.min(radius, w / 2, h / 2);

        context.beginPath();
        context.moveTo(x + r, y);
        context.arcTo(x + w, y, x + w, y + h, r);
        context.arcTo(x + w, y + h, x, y + h, r);
        context.arcTo(x, y + h, x, y, r);
        context.arcTo(x, y, x + w, y, r);
        context.closePath();
      }

      function syncTouchControls() {
        const show = state === "game" && !gameOver && !won;
        touchControls.style.display = show ? "block" : "none";
      }

      function draw() {
        syncTouchControls();

        if (state === "menu") {
          drawMenu();
        } else if (state === "select") {
          drawSelection();
        } else {
          drawGame();
        }
      }

      function canvasPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (W / rect.width),
          y: (event.clientY - rect.top) * (H / rect.height)
        };
      }

      function menuRects() {
        return [
          { x: W / 2 - 280, y: 266, w: 560, h: 58 },
          { x: W / 2 - 180, y: 330, w: 360, h: 58 }
        ];
      }

      function selectionCardRects() {
        const cardW = 165;
        const cardH = 300;
        const gap = 18;
        const total = cardW * 5 + gap * 4;
        const startX = (W - total) / 2;
        const y = 135;

        return characters.map((_, i) => ({
          x: startX + i * (cardW + gap),
          y,
          w: cardW,
          h: cardH
        }));
      }

      function handlePointerDown(id, x, y) {
        pointers.set(id, { x, y });

        if (state === "menu") {
          const rects = menuRects();

          if (pointInRect(x, y, rects[0])) {
            menuIndex = 0;
            state = "select";
            return;
          }

          if (pointInRect(x, y, rects[1])) {
            menuIndex = 1;
            startGame();
            return;
          }
        }

        if (state === "select") {
          const cards = selectionCardRects();

          for (let i = 0; i < cards.length; i++) {
            if (pointInRect(x, y, cards[i])) {
              selectedCharacter = i;
              if (characters[i].loaded) {
                state = "menu";
              }
              return;
            }
          }
        }

        if (state === "game") {
          if (gameOver || won) {
            const retry = { x: W / 2 - 215, y: H / 2 + 55, w: 200, h: 58 };
            const chars = { x: W / 2 + 15, y: H / 2 + 55, w: 200, h: 58 };

            if (pointInRect(x, y, retry)) {
              resetGame();
              return;
            }

            if (pointInRect(x, y, chars)) {
              state = "select";
              return;
            }
          }

          if (pointInRect(x, y, controls.jump)) {
            pressed.jumpQueued = true;
          }

          updateTouchDirections();
        }
      }

      function updateTouchDirections() {
        let left = false;
        let right = false;

        for (const point of pointers.values()) {
          if (pointInRect(point.x, point.y, controls.left)) left = true;
          if (pointInRect(point.x, point.y, controls.right)) right = true;
        }

        pressed.left = left || keyboard.left || buttonHeld.left;
        pressed.right = right || keyboard.right || buttonHeld.right;
      }

      function handlePointerMove(id, x, y) {
        if (!pointers.has(id)) return;
        pointers.set(id, { x, y });
        updateTouchDirections();
      }

      function handlePointerUp(id) {
        pointers.delete(id);
        updateTouchDirections();
      }

      const keyboard = {
        left: false,
        right: false
      };

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (["arrowleft", "arrowright", "arrowup", "arrowdown", " ", "enter"].includes(key)) {
          event.preventDefault();
        }

        if (state === "menu") {
          if (key === "arrowup" || key === "w" || key === "arrowdown" || key === "s") {
            menuIndex = 1 - menuIndex;
          } else if (key === "enter" || key === " ") {
            if (menuIndex === 0) {
              state = "select";
            } else {
              startGame();
            }
          }
          return;
        }

        if (state === "select") {
          if (key === "escape") {
            state = "menu";
          } else if (key === "arrowleft" || key === "a") {
            selectedCharacter = (selectedCharacter - 1 + characters.length) % characters.length;
          } else if (key === "arrowright" || key === "d") {
            selectedCharacter = (selectedCharacter + 1) % characters.length;
          } else if (key === "enter" || key === " ") {
            if (characters[selectedCharacter].loaded) {
              state = "menu";
            }
          }
          return;
        }

        if (state === "game") {
          if (key === "a" || key === "arrowleft") {
            keyboard.left = true;
            pressed.left = true;
          }

          if (key === "d" || key === "arrowright") {
            keyboard.right = true;
            pressed.right = true;
          }

          if (key === "w" || key === "arrowup" || key === " ") {
            pressed.jumpQueued = true;
          }

          if (key === "r") {
            resetGame();
          }

          if (key === "c") {
            state = "select";
          }

          if (key === "escape") {
            state = "menu";
          }
        }
      });

      window.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();

        if (key === "a" || key === "arrowleft") {
          keyboard.left = false;
        }

        if (key === "d" || key === "arrowright") {
          keyboard.right = false;
        }

        updateTouchDirections();
      });

      canvas.addEventListener("pointerdown", (event) => {
        canvas.setPointerCapture?.(event.pointerId);
        const p = canvasPoint(event);
        handlePointerDown(event.pointerId, p.x, p.y);
      });

      canvas.addEventListener("pointermove", (event) => {
        const p = canvasPoint(event);
        handlePointerMove(event.pointerId, p.x, p.y);
      });

      canvas.addEventListener("pointerup", (event) => {
        handlePointerUp(event.pointerId);
      });

      canvas.addEventListener("pointercancel", (event) => {
        handlePointerUp(event.pointerId);
      });

      canvas.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      function bindHoldButton(button, direction) {
        const down = (event) => {
          event.preventDefault();
          event.stopPropagation();
          buttonHeld[direction] = true;
          updateTouchDirections();

          try {
            button.setPointerCapture(event.pointerId);
          } catch (_) {}
        };

        const up = (event) => {
          event.preventDefault();
          event.stopPropagation();
          buttonHeld[direction] = false;
          updateTouchDirections();
        };

        button.addEventListener("pointerdown", down);
        button.addEventListener("pointerup", up);
        button.addEventListener("pointercancel", up);
        button.addEventListener("lostpointercapture", up);
      }

      bindHoldButton(moveLeftButton, "left");
      bindHoldButton(moveRightButton, "right");

      jumpButton.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();
        pressed.jumpQueued = true;

        try {
          jumpButton.setPointerCapture(event.pointerId);
        } catch (_) {}
      });

      let last = performance.now();
      let accumulator = 0;
      const step = 1000 / FPS;

      function loop(now) {
        const delta = Math.min(50, now - last);
        last = now;
        accumulator += delta;

        while (accumulator >= step) {
          if (state === "game") {
            updateGame();
          }

          accumulator -= step;
        }

        draw();
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
